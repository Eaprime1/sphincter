# prima.yaml — Concept Manifest for sphincter
# Run: bash tools/scan_lexeme.sh to surface unresolved placeholders.

concept:
  name: "Sphincter"
  slug: "sphincter"
  version: "0.1.0"
  tagline: "A quest-driven terminal space that turns fragments into focused action."
  theme: "systems"

author:
  handle: "Eaprime1"
  contact: "@Eaprime1"

runtime:
  platform: "any"
  min_android_api: 24
  required_packages:
    - git
    - curl
  optional_packages:
    - vim
    - python
    - openssh

unexusi:
  profile_version: "1.0"
  spec: "unexusi/connect.yaml"

quests:
  start: "quests/000-thee-the-door.md"   # first quest — name the concept
  format_spec: "quests/QUEST_SCHEMA.md"

world:
  lore: "world/lore.md"
  factions: "world/factions.md"

seeds:
  bootstrap: "seeds/bootstrap.sh"
  packages: "seeds/packages.yaml"

intake:
  door: "intake/README.md"
  incoming: "intake/incoming.md"
  triad: "intake/triad-thee-yod-ember.md"

turns:
  schema: "turns/TURN_SCHEMA.md"
  log: "turns/log.md"

prime:
  state: ".prime"
  check: "tools/prime_check.sh"

tools:
  thee: "tools/thee.sh"
  yod: "tools/yod.sh"
  ember: "tools/ember.sh"
  prime_check: "tools/prime_check.sh"
  scan_lexeme: "tools/scan_lexeme.sh"
  ethics_check: "tools/ethics_check.md"
